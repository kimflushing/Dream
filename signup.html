<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dream Archive | Sign Up</title>

<link rel="stylesheet" href="css/login.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

</head>

<body>

<div class="background"></div>

<div class="loginCard">

<h1>Dream Archive</h1>

<p class="subtitle">
새로운 아카이브를 만들어보세요.
</p>

<form id="signupForm">

<input
type="text"
id="nickname"
placeholder="닉네임"
required>

<input
type="email"
id="email"
placeholder="이메일"
required>

<input
type="password"
id="password"
placeholder="비밀번호"
required>

<input
type="password"
id="passwordCheck"
placeholder="비밀번호 확인"
required>

<button type="submit">
회원가입
</button>

</form>

<div class="bottom">

<p>
이미 계정이 있으신가요?
</p>

<a href="login.html">
로그인
</a>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="js/supabase.js"></script>

<script src="js/auth.js"></script>

</body>

</html>
