<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dream Archive</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

</head>

<body>

<!-- 배경 -->

<div class="background">

<div class="blur one"></div>
<div class="blur two"></div>
<div class="blur three"></div>

</div>

<!-- 헤더 -->

<header>

<h1>Dream Archive</h1>

<div class="headerButtons">

<button id="createDream">

＋ 드림 추가

</button>

<button id="logoutBtn">

로그아웃

</button>

</div>

</header>

<!-- 검색 -->

<section class="searchArea">

<input
type="text"
id="searchInput"
placeholder="드림 검색...">

</section>

<!-- 카드 목록 -->

<main>

<div id="dreamList" class="dreamGrid">

<!-- JS에서 자동 생성 -->

</div>

</main>

<!-- 빈 화면 -->

<template id="emptyTemplate">

<div class="emptyBox">

<h2>☁️</h2>

<p>

아직 등록된 드림이 없습니다.

</p>

</div>

</template>

<!-- 카드 -->

<template id="dreamCardTemplate">

<div class="dreamCard">

<img class="cardImage" src="default.png">

<div class="cardBody">

<h2 class="cardTitle"></h2>

<p class="cardDay"></p>

<p class="cardIntro"></p>

</div>

</div>

</template>

<!-- 생성 모달 -->

<div id="createModal" class="modal">

<div class="modalBox">

<h2>

새 드림

</h2>

<input
id="dreamName"
placeholder="드림 이름">

<textarea
id="dreamIntro"
placeholder="소개">

</textarea>

<input
type="date"
id="dreamDate">

<input
type="file"
id="dreamImage"
accept="image/*">

<div id="previewImage">

</div>

<div class="modalButtons">

<button id="saveDream">

저장

</button>

<button id="closeModal">

취소

</button>

</div>

</div>

</div>

<!-- 로딩 -->

<div id="loadingScreen">

<div class="loader"></div>

</div>

<!-- Toast -->

<div id="toast">

완료되었습니다.

</div>

<!-- 설정 -->

<div id="settingModal" class="modal">

<div class="modalBox">

<h2>

설정

</h2>

<button id="backupBtn">

JSON 백업

</button>

<button id="restoreBtn">

JSON 복원

</button>

<input
type="file"
id="restoreFile"
accept=".json"
hidden>

<hr>

<button id="closeSetting">

닫기

</button>

</div>

</div>

<button id="settingBtn" class="settingButton">

⚙️

</button>

<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="script.js"></script>

</body>

</html>
