<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dream Archive</title>

<link rel="stylesheet" href="dream.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

</head>

<body>

<div class="background">

<div class="blur one"></div>
<div class="blur two"></div>
<div class="blur three"></div>

</div>

<header>

<button id="backBtn">

← HOME

</button>

<h1>

Dream Archive

</h1>

<div class="headerButton">

<button id="saveBtn">

💾 저장

</button>

<button id="settingBtn">

⚙️

</button>

</div>

</header>

<main>

<section class="profileCard">

<div class="imageArea">

<label for="mainImage">

<img
id="previewImage"
src="default.png">

</label>

<input
type="file"
id="mainImage"
accept="image/*"
hidden>

</div>

<div class="profileInfo">

<select id="archiveType">

<option value="dream">

❤️ 드림

</option>

<option value="couple">

💍 자컾

</option>

</select>

<input
id="dreamName"
placeholder="이름">

<input
type="date"
id="startDate">

<p id="dday">

D+0

</p>

<textarea
id="intro"
placeholder="한줄 소개">

</textarea>

</div>

</section>
<!-- ===========================
탭 메뉴
=========================== -->

<nav class="tabMenu">

<button class="tab active" data-tab="appearance">

👤 외관

</button>

<button class="tab" data-tab="setting">

⚙️ 설정

</button>

<button class="tab" data-tab="story">

📖 서사

</button>

<button class="tab" data-tab="relation">

💞 관계

</button>

<button class="tab" data-tab="au">

🌎 AU

</button>

<button class="tab" data-tab="commission">

🎨 커미션

</button>

</nav>

<!-- ===========================
컨텐츠
=========================== -->

<div class="contentArea">

<!-- 외관 -->

<section class="tabContent active" id="appearance">

<h2>외관</h2>

<input
id="characterName"
placeholder="캐릭터 이름">

<input
id="height"
placeholder="키">

<input
id="birthday"
placeholder="생일">

<input
id="age"
placeholder="나이">

<input
id="mbti"
placeholder="MBTI">

<input
id="job"
placeholder="직업">

<textarea
id="appearanceText"
placeholder="외관 설명">

</textarea>

</section>

<!-- 설정 -->

<section class="tabContent" id="setting">

<h2>설정</h2>

<input
id="worldName"
placeholder="세계관">

<input
id="group"
placeholder="소속">

<input
id="ability"
placeholder="능력">

<textarea
id="settingText"
placeholder="설정을 작성하세요.">

</textarea>

</section>

<!-- 서사 -->

<section class="tabContent" id="story">

<h2>서사</h2>

<textarea
id="storyText"
placeholder="서사를 작성하세요.">

</textarea>

</section>

<!-- 관계 -->

<section class="tabContent" id="relation">

<div class="sectionHeader">

<h2>

💞 관계

</h2>

<button id="addRelation">

＋ 관계 추가

</button>

</div>

<div id="relationList">

</div>

</section>
<!-- ===========================
관계 타임라인
=========================== -->

<div class="timelineSection">

<div class="sectionHeader">

<h2>

📜 관계 타임라인

</h2>

<button id="addTimeline">

＋ 사건 추가

</button>

</div>

<div id="timelineList">

</div>

</div>

</div>

<!-- ===========================
AU
=========================== -->

<section class="tabContent" id="au">

<div class="sectionHeader">

<h2>

🌎 AU

</h2>

<button id="addAU">

＋ AU 추가

</button>

</div>

<div id="auList">

</div>

</section>

<!-- ===========================
관계 Template
=========================== -->

<template id="relationTemplate">

<div class="relationCard">

<div class="relationImage">

<img class="relationPreview" src="default.png">

<input
type="file"
class="relationPhoto"
accept="image/*"
hidden>

</div>

<div class="relationInfo">

<input
class="relationName"
placeholder="캐릭터 이름">

<input
class="relationType"
placeholder="관계 (연인, 친구 등)">

<textarea
class="relationDescription"
placeholder="관계 설명">

</textarea>

<textarea
class="relationMemo"
placeholder="메모">

</textarea>

<button class="deleteRelation">

삭제

</button>

</div>

</div>

</template>

<!-- ===========================
Timeline Template
=========================== -->

<template id="timelineTemplate">

<div class="timelineCard">

<input
type="date"
class="timelineDate">

<input
class="timelineTitle"
placeholder="사건 제목">

<textarea
class="timelineContent"
placeholder="내용">

</textarea>

<button class="deleteTimeline">

삭제

</button>

</div>

</template>
<!-- ===========================
AU Template
=========================== -->

<template id="auTemplate">

<div class="auCard">

<div class="auImageArea">

<img
class="auPreview"
src="default.png">

<input
type="file"
class="auImage"
accept="image/*"
hidden>

</div>

<div class="auInfo">

<input
class="auTitle"
placeholder="AU 이름">

<input
class="auWorld"
placeholder="세계관">

<textarea
class="auDescription"
placeholder="AU 설명">

</textarea>

<textarea
class="auMemo"
placeholder="메모">

</textarea>

<div class="galleryArea">

<h4>

갤러리

</h4>

<input
type="file"
class="auGallery"
accept="image/*"
multiple>

<div class="galleryPreview">

</div>

</div>

<button class="deleteAU">

삭제

</button>

</div>

</div>

</template>

<!-- ===========================
커미션
=========================== -->

<section class="tabContent"

id="commission">

<div class="sectionHeader">

<h2>

🎨 커미션

</h2>

<button id="addCommission">

＋ 커미션 추가

</button>

</div>

<div id="commissionList">

</div>

</section>
<!-- ===========================
Commission Template
=========================== -->

<template id="commissionTemplate">

<div class="commissionCard">

<div class="commissionImageArea">

<img
class="commissionPreview"
src="default.png">

<input
type="file"
class="commissionImage"
accept="image/*"
hidden>

</div>

<div class="commissionInfo">

<input
class="artistName"
placeholder="작가님">

<input
class="commissionLink"
placeholder="링크 (X, 포스타입 등)">

<textarea
class="commissionMemo"
placeholder="메모">

</textarea>

<div class="commissionGallery">

<h4>

추가 이미지

</h4>

<input
type="file"
class="commissionGalleryInput"
accept="image/*"
multiple>

<div class="commissionGalleryPreview">

</div>

</div>

<button class="deleteCommission">

삭제

</button>

</div>

</div>

</template>

<!-- ===========================
갤러리
=========================== -->

<section class="gallerySection">

<div class="sectionHeader">

<h2>

🖼 전체 갤러리

</h2>

</div>

<div id="galleryGrid">

<!-- JS에서 자동 생성 -->

</div>

</section>

<!-- ===========================
자동 저장 상태
=========================== -->

<div class="saveStatus">

<span id="saveState">

☁️ 자동 저장 활성화

</span>

</div>

<!-- ===========================
Toast
=========================== -->

<div id="toast">

저장되었습니다.

</div>
<!-- ===========================
설정 모달
=========================== -->

<div id="settingModal" class="modal">

<div class="modalBox">

<h2>

설정

</h2>

<button id="changeCover">

대표 이미지 변경

</button>

<button id="exportJSON">

📦 JSON 백업

</button>

<button id="importJSON">

📂 JSON 불러오기

</button>

<input
type="file"
id="jsonFile"
accept=".json"
hidden>

<hr>

<button id="deleteDream">
🗑 아카이브 삭제
</button>

<button id="closeSetting">

닫기

</button>

</div>

</div>



<!-- ===========================
이미지 확대
=========================== -->

<div id="imageViewer" class="viewer">

<span id="closeViewer">

✕

</span>

<img id="viewerImage">

</div>



<!-- ===========================
Floating Decoration
=========================== -->

<div class="floating one">

🌸

</div>

<div class="floating two">

✨

</div>

<div class="floating three">

☁️

</div>



<!-- ===========================
Loading
=========================== -->

<div id="loadingScreen">

<div class="loadingBox">

<div class="loader">

</div>

<p>

Saving...

</p>

</div>

</div>



<!-- ===========================
마지막 저장
=========================== -->

<div class="lastSave">

<p>

마지막 저장

</p>

<span id="lastSaveTime">

-

</span>

</div>

</main>



<!-- ===========================
Script
=========================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="dream.js"></script>

</body>

</html>
