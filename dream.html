<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dream Archive</title>

<link rel="stylesheet" href="dream.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

</head>

<body>

<div class="background">

<div class="blur one"></div>
<div class="blur two"></div>
<div class="blur three"></div>

</div>

<header>

<button id="backBtn">

← 목록으로

</button>

<h1 id="dreamTitle">

Dream Archive

</h1>

<button id="saveBtn">

💾 저장

</button>

</header>

<main>

<section class="profileCard">

<div class="imageArea">

<img
id="previewImage"
src="default.png">

<input
type="file"
id="mainImage"
accept="image/*"
hidden>

<button id="changeImage">

대표 이미지 변경

</button>

</div>

<div class="profileInfo">

<input
id="dreamName"
placeholder="드림 이름">

<input
type="date"
id="startDate">

<p id="dday">

D+0

</p>

<textarea
id="intro"
placeholder="한줄 소개">

</textarea>

</div>

</section>

<nav class="tabMenu">

<button class="tab active"

data-tab="appearance">

👤 외관

</button>

<button class="tab"

data-tab="setting">

⚙️ 설정

</button>

<button class="tab"

data-tab="story">

📖 서사

</button>

<button class="tab"

data-tab="relation">

💞 관계

</button>

<button class="tab"

data-tab="au">

🌎 AU

</button>

<button class="tab"

data-tab="commission">

🎨 커미션

</button>

</nav>

<div class="contentArea">

<section
class="tabContent active"
id="appearance">

<h2>외관</h2>

<input
id="characterName"
placeholder="캐릭터 이름">

<input
id="height"
placeholder="키">

<input
id="birthday"
placeholder="생일">

<input
id="age"
placeholder="나이">

<input
id="mbti"
placeholder="MBTI">

<input
id="job"
placeholder="직업">

<textarea
id="appearanceText"
placeholder="외관 설명">

</textarea>

</section>

<section
class="tabContent"
id="setting">

<h2>설정</h2>

<input
id="worldName"
placeholder="세계관">

<input
id="group"
placeholder="소속">

<input
id="ability"
placeholder="능력">

<textarea
id="settingText"
placeholder="설정">

</textarea>

</section>

<section
class="tabContent"
id="story">

<h2>서사</h2>

<textarea
id="storyText"
placeholder="서사를 작성하세요.">

</textarea>

</section>
<!-- ===========================
관계
=========================== -->

<section class="tabContent" id="relation">

<div class="sectionHeader">

<h2>💞 관계</h2>

<button id="addRelation">

＋ 관계 추가

</button>

</div>

<div id="relationList"></div>

</section>

<!-- ===========================
AU
=========================== -->

<section class="tabContent" id="au">

<div class="sectionHeader">

<h2>🌎 AU</h2>

<button id="addAU">

＋ AU 추가

</button>

</div>

<div id="auList"></div>

</section>

<!-- ===========================
커미션
=========================== -->

<section class="tabContent" id="commission">

<div class="sectionHeader">

<h2>🎨 커미션</h2>

<button id="addCommission">

＋ 커미션 추가

</button>

</div>

<div id="commissionList"></div>

</section>

</div>

<!-- ===========================
전체 갤러리
=========================== -->

<section class="gallerySection">

<h2>

🖼 갤러리

</h2>

<div id="galleryGrid">

</div>

</section>

</main>

<!-- ===========================
저장 상태
=========================== -->

<div id="toast">

저장되었습니다.

</div>

<!-- ===========================
Loading
=========================== -->

<div id="loadingScreen">

<div class="loader"></div>

</div>

<!-- ===========================
설정창
=========================== -->

<div id="settingModal" class="modal">

<div class="modalBox">

<h2>

설정

</h2>

<button id="exportJSON">

📦 JSON 백업

</button>

<button id="importJSON">

📂 JSON 불러오기

</button>

<input
type="file"
id="jsonFile"
accept=".json"
hidden>

<hr>

<button id="deleteDream">

🗑 드림 삭제

</button>

<button id="closeSetting">

닫기

</button>

</div>

</div>

<!-- ===========================
이미지 확대
=========================== -->

<div id="imageViewer" class="viewer">

<span id="closeViewer">

✕

</span>

<img id="viewerImage">

</div>

<!-- ===========================
스크립트
=========================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="dream.js"></script>

</body>
</html>
